<!doctype html>
<html lang="pt-BR">
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Catálogo de produtos da Casa de Carnes Ribeiro. Monte seu pedido e envie pelo WhatsApp."
    />
    <meta name="theme-color" content="#9E1B1F" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Ribeiro Tuiuti Carnes" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Casa de Carnes Ribeiro Tuiuti · Catálogo</title>
    <link rel="manifest" href="manifest.json" />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f8f4f0;
      }

      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f8f4f0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #7a6e68;
        transition: opacity 0.3s ease;
        z-index: 9999;
      }

      #splash .logo {
        /* 96px no celular, até 128px em telas grandes */
        width: clamp(96px, 22vw, 128px);
        aspect-ratio: 1;
        border-radius: 28%;
        object-fit: cover;
        box-shadow: 0 12px 32px rgba(158, 27, 31, 0.22);
        animation: pulse 1.6s ease-in-out infinite;
      }

      #splash .nome {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }

      @keyframes pulse {
        50% {
          transform: scale(0.94);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash .logo {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img class="logo" src="icons/icon_logo.png" alt="" />
      <span class="nome">Casa de Carnes Ribeiro Tuiuti</span>
    </div>

    <script>
      window.addEventListener("flutter-first-frame", function () {
        var s = document.getElementById("splash");
        if (!s) return;
        s.style.opacity = "0";
        setTimeout(function () {
          s.remove();
        }, 300);
      });
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
