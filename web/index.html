<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Catálogo de produtos da Casa de Carnes Ribeiro. Monte seu pedido e envie pelo WhatsApp.">
  <meta name="theme-color" content="#9E1B1F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ribeiro Carnes">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Casa de Carnes Ribeiro · Catálogo</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F8F4F0; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #7A6E68; transition: opacity .3s ease;
    }
    #splash .logo {
      width: 64px; height: 64px; border-radius: 18px;
      background: linear-gradient(135deg, #9E1B1F, #6E0F12);
      box-shadow: 0 10px 30px rgba(158, 27, 31, .3);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { transform: scale(.92); } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo"></div>
    <div>Carregando catálogo…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
